<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!--
    Sentry · 开口环 + 三个点（扫描动画的旋转层）。

    从完整图标 SentryMenuBar.svg 里去掉箭头，只留开口环和那三个点。
    扫描时这一整层绕中心转：环的缺口和三个点一起转，点始终待在缺口里，
    不会像「点单独沿环跑」那样转到环上融进去看不见。箭头由 SentryArrow
    单独画、不转（下载方向不能跟着转）。

    几何与完整版逐项一致：环 r=7.6、描边 2、缺口 104° 居中正上；
    点半径 1，落在 -26°/0°/+26° 的缺口中。
  -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- 扫描盘：开口环，缺口 104° 居中正上（周长 47.75：画 33.96、空 13.79，转 -38°） -->
    <circle cx="11" cy="11" r="7.6" stroke-width="2"
            stroke-dasharray="33.96 13.79" transform="rotate(-38 11 11)"/>
    <!-- 三个点，与环同粗（直径 2），骑在环的中线上：±26° 与正上 -->
    <g fill="#000" stroke="none">
      <circle cx="7.669" cy="4.17" r="1"/>
      <circle cx="11" cy="3.4" r="1"/>
      <circle cx="14.331" cy="4.17" r="1"/>
    </g>
  </g>
</svg>
