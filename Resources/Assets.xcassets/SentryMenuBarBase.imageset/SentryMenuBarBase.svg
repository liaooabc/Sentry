<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!--
    Sentry · 菜单栏图标「无点底图」——扫描动画专用。

    完整版 SentryMenuBar.svg = 开口环 + 顶部三个点 + 箭头。
    这张去掉了那三个点，只留开口环 + 箭头：扫描时由代码画三个点
    沿环（r=7.6）旋转，做出加载效果，静态时仍用完整版。

    几何与完整版逐项一致（同一坐标系、同样描边），两者切换不跳变：
    · 环 r=7.6，描边 2，缺口 104° 居中正上
    · 箭杆 x=11, y=7.48→13.08，描边 2.32；箭尖 y=14.84（朝下）
    template 渲染：只保留 alpha，系统按菜单栏明暗自动反色。
  -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- 扫描盘：开口环，缺口 104° 居中正上（周长 47.75：画 33.96、空 13.79，转 -38°） -->
    <circle cx="11" cy="11" r="7.6" stroke-width="2"
            stroke-dasharray="33.96 13.79" transform="rotate(-38 11 11)"/>
    <!-- 箭杆 -->
    <line x1="11" y1="7.48" x2="11" y2="13.08" stroke-width="2.32"/>
    <!-- 箭头（朝下） -->
    <polyline points="7.56,11.64 11,14.84 14.44,11.64" stroke-width="2.32"/>
  </g>
</svg>
